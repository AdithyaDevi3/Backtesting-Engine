services:
  database:
    image: postgres:17-alpine
    env_file: ${ALPHATEST_ENV_FILE:-.env}
    environment:
      POSTGRES_DB: alphatest
      POSTGRES_USER: alphatest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphatest -d alphatest"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: ${ALPHATEST_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: database
      POSTGRES_DB: alphatest
      POSTGRES_USER: alphatest
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      database:
        condition: service_healthy

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    env_file: ${ALPHATEST_ENV_FILE:-.env}
    environment:
      ALPHATEST_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

  worker:
    build: .
    command: python -m app.jobs
    env_file: ${ALPHATEST_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: database
      POSTGRES_DB: alphatest
      POSTGRES_USER: alphatest
    depends_on:
      database:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres-data:
